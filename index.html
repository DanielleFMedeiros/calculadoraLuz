<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Luz</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="calculator-container">

        <h1>Calculadora de Luz</h1>

        <!-- SELEÇÃO DO TITULAR -->
        <div class="titular-container">

            <button
                type="button"
                id="btnDani"
                class="ativo"
                onclick="selecionarTitular('Dani')">
                Dani
            </button>

            <button
                type="button"
                id="btnKitnet"
                onclick="selecionarTitular('Kitnet')">
                Kitnet
            </button>

        </div>


        <!-- CONSUMO TOTAL DA FATURA -->
        <div class="input-group">

            <label for="leituraTotal">
                Consumo Total da Fatura (kWh):
            </label>

            <input
                type="number"
                id="leituraTotal"
                placeholder="Ex.: 67"
                step="0.01">

        </div>


        <!-- LEITURA ATUAL KITNET -->
        <div class="input-group">

            <label for="leituraAtualPonto1">
                Leitura Atual da Kitnet:
            </label>

            <input
                type="number"
                id="leituraAtualPonto1"
                placeholder="Ex.: 5849"
                step="0.01">

        </div>


        <!-- LEITURA ANTERIOR KITNET -->
        <div class="input-group">

            <label for="leituraAnteriorPonto1">
                Leitura Anterior da Kitnet:
            </label>

            <input
                type="number"
                id="leituraAnteriorPonto1"
                placeholder="Ex.: 5810"
                step="0.01">

        </div>


        <!-- VALOR TOTAL DA FATURA -->
        <div class="input-group">

            <label for="valorFatura">
                Valor Total da Fatura (R$):
            </label>

            <input
                type="number"
                id="valorFatura"
                placeholder="Ex.: 75.37"
                step="0.01">

        </div>


        <!-- COSIP -->
        <div class="input-group">

            <label for="valorCosip">
                COSIP (R$):
            </label>

            <input
                type="number"
                id="valorCosip"
                value="15.40"
                step="0.01">

            <small>
                Altere somente se o valor da fatura mudar.
            </small>

        </div>


        <!-- BOTÃO CALCULAR -->
        <button
            type="button"
            onclick="calcular()">
            Calcular
        </button>


        <!-- RESULTADO -->
        <div
            id="resultado"
            class="resultado">
        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
