<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Luz</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="calculator-container">

        <h1>Calculadora de Luz</h1>

        <div class="titular-container">
            <button type="button" id="btnDani" class="ativo" onclick="selecionarTitular('Dani')">
                Dani
            </button>

            <button type="button" id="btnKitnet" onclick="selecionarTitular('Kitnet')">
                Kitnet
            </button>
        </div>

        <div class="input-group">
            <label for="leituraTotal">Consumo Total da Fatura (kWh):</label>
            <input type="number" id="leituraTotal" step="0.01">
        </div>

        <div class="input-group">
            <label for="leituraAtualPonto1">Leitura Atual do Medidor:</label>
            <input type="number" id="leituraAtualPonto1" step="0.01">
        </div>

        <div class="input-group">
            <label for="leituraAnteriorPonto1">Leitura Anterior do Medidor:</label>
            <input type="number" id="leituraAnteriorPonto1" step="0.01">
        </div>

        <div class="input-group">
            <label for="valorFatura">Valor Total da Fatura (R$):</label>
            <input type="number" id="valorFatura" step="0.01">
        </div>

        <div class="input-group">
            <label for="valorCosip">COSIP (R$):</label>
            <input type="number" id="valorCosip" value="15.40" step="0.01">

            <small>
                A COSIP será dividida igualmente entre os dois.
            </small>
        </div>

        <button onclick="calcular()">Calcular</button>

        <div id="resultado" class="resultado"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
